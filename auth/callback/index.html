<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login TikTok - LinkFinity</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#173a73 0%,#090d14 42%,#070a10 100%);color:#f8fbff;font-family:Inter,system-ui,Arial,sans-serif;margin:0}.callback-card{width:min(620px,92vw);background:linear-gradient(180deg,#141c2b,#101722);border:1px solid #2a3a55;border-radius:24px;padding:34px;box-shadow:0 20px 70px #0008}.callback-logo{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:900;margin-bottom:22px}.logo-mark{width:44px;height:44px;border-radius:14px;background:#3478ff;display:grid;place-items:center}.logo-mark svg{width:27px}.muted{color:#9fb0c8}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:12px;background:#3478ff;color:white;text-decoration:none;font-weight:900;margin-top:18px}.codebox{margin-top:18px;padding:14px;border-radius:14px;background:#0b111c;border:1px dashed #33445f;color:#c7d7f1;word-break:break-all}
  </style>
</head>
<body>
  <main class="callback-card">
    <div class="callback-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 3l7 18-7-4-7 4 7-18z"/><path d="M9 14h6"/></svg></div>
      <span>LinkFinity</span>
    </div>
    <h1>Callback do TikTok funcionando</h1>
    <p class="muted">Esta página existe para receber o retorno do Login Kit. Quando o backend OAuth estiver conectado, o código do TikTok será trocado por token com segurança no servidor.</p>
    <div class="codebox" id="info">Aguardando parâmetros do TikTok...</div>
    <a class="btn" href="/">Voltar para o LinkFinity</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const info = document.getElementById('info');
    if (error) info.textContent = 'Erro retornado pelo TikTok: ' + error;
    else if (code) info.textContent = 'Código OAuth recebido com sucesso. Code: ' + code + (state ? ' | State: ' + state : '');
    else info.textContent = 'Página pronta: /auth/callback';
  </script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LinkFinity Overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}#gift{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55) rotate(-5deg);opacity:0;max-width:460px;max-height:460px;object-fit:contain;background:transparent!important;transition:.28s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 28px 38px rgba(0,0,0,.42))}#gift.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}#gift.pop{animation:pop 1.1s ease both}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0}45%{transform:translate(-50%,-50%) scale(1.1) rotate(5deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}</style></head><body><img id="gift" alt="gift"><script src="overlay.js"></script></body></html>
